; MIIIME Settings Saver (MSS) Configuration Guide
; MIIIME Settings Saver (MSS) 1.0.0.3
; ⓒ 2026 MIIIME

; 가이드 파일임. 실제 사용 시 파일명을 MIIIMESettingsSaver.ini 로 변경할 것.
; This is a guide file. Rename it to MIIIMESettingsSaver.ini.
; 저장 구조는 MHL 의 {RawDat} 표준을 따름 :
; The saved layout follows the MHL {RawDat} standard :
;
;   {RawDat}/
;   ├─ AppDat/ (Local / Roaming / LocalLow)   앱데이터 폴더 (직계 폴더 단위) / AppData folders (direct subfolders only)
;   ├─ Reg/                                   레지스트리 (키 1개 = .reg 1개)     / Registry (1 key = 1 .reg)
;   └─ Set/                                   {Run} 설정 파일                    / Settings files from {Run}

; =======================================================================================
; 연동 모드 / 독립 모드 (Linked / Standalone)
; =======================================================================================
; 섹션 [Source] [AppDat] [Set] [Reg] 는 각각 LinkedMode 를 가짐 (MUC 와 동일 방식).
; Sections [Source] [AppDat] [Set] [Reg] each have LinkedMode (same as MUC).
;   LinkedMode=1 : 소스 정보를 MHL INI (LinkedIniName 으로 탐색) 에서 읽음.
;                  Reads source info from the MHL INI (found by LinkedIniName).
;       [Source] -> RawDataPath (저장 경로 / Output path)
;       [AppDat] -> AppName      [Set] -> RunPath      [Reg] -> AppName + MHL [Registry] 키 목록 / key list
;   LinkedMode=0 : 이 파일의 [Source] 값을 사용 (독립 모드).
;                  Uses the values of [Source] in this file (standalone mode).
; ※ 추가 항목(벤더 폴더, 확장자, 제외 목록, 추가 키)은 연동 모드에서도 이 파일에 적으며, 소스 정보에 더해서 적용됨.
; ※ Extra entries (vendor folders, extensions, excludes, extra keys) are always written in this file and are added on top of the source info.
; ※ 모든 섹션이 LinkedMode=0 이면 MHL INI 는 찾지 않음 (에러 없음).
; ※ If every section is 0, the MHL INI is not searched (no error).

[Launch]
; 메시지 창 등에 표시되는 프로그램 이름.
; Application name shown in message boxes, etc.
AppName=MIIIME Settings Saver

; 관리자 권한으로 실행 (1=사용, 0=미사용). HKLM 키를 저장할 때만 필요.
; Run as administrator (1=Enable, 0=Disable). Needed only when saving HKLM keys.
RunAsAdmin=0

; 작업 완료 후 요약 메시지 표시 (1=표시, 0=미표시).
; Show summary message after the job (1=Show, 0=Hide).
ShowFinishMsg=1

[Options]
; 로그 레벨 / Log level : 0=Off, 1=All, 2=DEBUG, 3=INFO, 4=WARN, 5=ERROR
LogLevel=0

; 연동모드 파일명 / Linked Mode Filename (MUC 와 동일 / same as MUC)
; 파이프(|)로 구분, 앞에서부터 탐색하여 .ini 가 발견된 첫 항목을 사용.
; Pipe (|) separated; the first entry that finds a .ini is used.
; 와일드카드 ~ ^ 사용 가능. 한 항목에서 2개 이상 발견되거나 어느 항목에서도 없으면 에러.
; Wildcards ~ ^ supported. Error if one entry finds 2+ files or none finds a file.
LinkedIniName=|*_x64_M|*_M|*_x86_M|

; 미리보기 (1=저장하지 않고 후보 목록만 로그에 기록, 0=실제 저장).
; Preview (1=Log candidates only, nothing is saved / 0=Save for real).
; ※ Preview=1 이면 LogLevel=0 이어도 LogLevel 이 1(INFO 이상)로 자동 상향됨. (결과 목록을 로그로 확인하기 위함)
; ※ With Preview=1, LogLevel=0 is raised to 1 (INFO or higher) automatically so the result list is logged.
Preview=1

; 이미 저장된 항목이 있을 때 (1={RawDat}_bakk 폴더로 백업 후 덮어쓰기, 0=건너뜀). 백업은 1세대만 보관.
; When the target already exists (1=Back up to the {RawDat}_bakk folder then overwrite, 0=Skip). Only one backup generation is kept.
Overwrite=1

[Source]
; 독립 모드용 소스 정보. 각 값은 해당 섹션이 LinkedMode=1 이면 MHL INI 값을 쓰고 이 값은 무시됨.
; Source info for standalone mode. Each value is ignored when the section that uses it has LinkedMode=1 (MHL INI value is used).
;   AppName -> [AppDat] / [Reg]    RunPath -> [Set]    Output -> [Source] (이 섹션 / this section)
LinkedMode=0

; 소스 프로그램 이름 - AppDat 과 Reg 의 기본 후보 폴더 / 키 이름으로 사용됨.
; Source program name - used as the default candidate folder / key name for AppDat and Reg.
AppName=TargetApp

; 소스 프로그램 경로 - 설치 폴더 (Set 의 검색 대상). 매크로 사용 가능.
; Source program path - install folder (searched by Set). Macros supported.
RunPath={ProgramFiles}\TargetApp

; 저장 경로 ({RawDat} 에 해당). 비우면 MSS 폴더\{AppName}\App\RawDat 를 자동 생성함.
; Output path (equals {RawDat}). If empty, MSSFolder\{AppName}\App\RawDat is created automatically.
Output=

[AppDat]
; 앱데이터 폴더를 AppDat\Local / Roaming / LocalLow 로 저장.
; Saves AppData folders into AppDat\Local / Roaming / LocalLow.
; ※ MHL 은 직계 폴더 단위로만 주입하므로, 지정한 폴더 전체가 통째로 저장됨.
; ※ MHL injects direct subfolders only, so the whole specified folder is saved.
LinkedMode=0

; 1 = AppName 과 같은 이름의 폴더를 Local / Roaming / LocalLow 3곳에서 자동으로 찾음.
; 1 = Automatically looks for a folder named like AppName in Local / Roaming / LocalLow.
AutoAppName=1

; 형식 : 위치|폴더명 (위치 : Local / Roaming / LocalLow). 와일드카드 ~ ^ 지원.
; Format : Root|FolderName (Root : Local / Roaming / LocalLow). Wildcards ~ ^ supported.
; ※ 벤더 폴더를 지정하면 같은 벤더의 다른 앱 데이터도 함께 저장됨 (WARN 로그).
; ※ A vendor folder also saves the vendor's other apps' data (WARN log).
; ※ 직계 폴더 이름만 지원 (\ / : 포함 불가). 와일드카드 항목은 와일드카드가 아닌 글자가 3자 이상 필요.
; ※ Direct subfolder names only (no \ / :). Wildcard entries need 3+ normal characters.
; ※ Junction / 심볼릭 링크 폴더, 시스템 폴더, 저장 경로({RawDat})를 포함하는 폴더는 건너뜀 (WARN 로그).
; ※ Junction / symbolic-link folders, system folders and folders containing the output path are skipped (WARN log).
; ※ Microsoft / Windows / Packages / Temp 이름의 폴더는 기본적으로 저장하지 않음.
; ※ Folders named Microsoft / Windows / Packages / Temp are not saved by default.
01=Roaming|VendorName
02=Local|VendorName

[Set]
; {Run} (소스 프로그램 폴더) 안의 설정 파일을 Set 폴더로 저장 (하위 폴더 구조 유지).
; Saves settings files inside {Run} (source program folder) into the Set folder (subfolder structure kept).
LinkedMode=0

; 저장할 확장자 목록 (|확장자1|확장자2| 형식, 점 없이).
; Extensions to save (|ext1|ext2| format, without dot).
Ext=|ini|cfg|xml|json|txt|conf|

; 추가로 저장할 파일 / 폴더 이름 (|이름1|이름2| 형식, 와일드카드 ~ ^ 지원). 확장자와 무관하게 저장.
; 이름 또는 {Run} 기준 상대 경로(예: data\~.ini)와 비교. 폴더 이름이 맞으면 그 폴더 전체를 저장 (Depth 무시).
; Extra file / folder names to save (|name1|name2| format, wildcards ~ ^ supported). Saved regardless of extension.
; Compared with the name or the path relative to {Run} (e.g. data\~.ini). A matching folder is saved entirely (Depth is ignored).
Include=||

; 제외할 파일 / 폴더 이름 (|이름1|이름2| 형식, 와일드카드 ~ ^ 지원). Ext / Include 보다 우선함. 폴더 이름이 맞으면 폴더째 제외.
; File / folder names to exclude (|name1|name2| format, wildcards ~ ^ supported). Takes priority over Ext and Include. A matching folder is skipped entirely.
Exclude=|license~|readme~|changelog~|unins~|~.log|

; 하위 폴더 검색 깊이 (0=소스 폴더 바로 아래만, 숫자가 클수록 깊이 검색).
; Subfolder search depth (0=top level of the source folder only; larger = deeper).
Depth=2

; 이 크기(KB)보다 큰 파일은 건너뜀 (0=제한 없음).
; Files larger than this size (KB) are skipped (0=No limit).
; ※ 저장본과 크기 / 수정 시각이 같은 파일은 다시 저장하지 않음. 저장할 파일이 5000개를 넘으면 WARN 후 중단.
; ※ Files whose size and modified time match the saved copy are not saved again. Stops with a WARN after 5000 files.
; ※ Documents / Desktop / Downloads 등 사용자 데이터 폴더 이름은 기본적으로 저장하지 않음.
; ※ User data folder names such as Documents / Desktop / Downloads are not saved by default.
MaxSizeKB=1024

[Reg]
; 레지스트리 키를 Reg\항목이름.reg 로 저장 (키 1개 = 파일 1개). 항목 이름 = MHL INI [Registry] 의 항목 이름 (예: 01 → Reg\01.reg).
; Saves registry keys as Reg\EntryName.reg (1 key = 1 file). The entry name is the entry name used in [Registry] of the MHL INI (e.g. 01 -> Reg\01.reg).
; ※ 키 전체 경로만 지원. 값 단위 (키|값명) 항목은 지원하지 않음 (연동 모드에서는 건너뜀 + WARN).
; ※ Full key paths only. Value-level entries (Key|ValueName) are not supported (skipped with WARN in linked mode).
LinkedMode=0

; 1 = HKEY_CURRENT_USER\SOFTWARE\{AppName} 키를 자동 후보로 사용.
; 1 = Uses HKEY_CURRENT_USER\SOFTWARE\{AppName} as an automatic candidate.
; ※ 이 후보는 00.reg 로 저장됨. MHL INI 의 [Registry] 에는 00=HKEY_CURRENT_USER\SOFTWARE\<AppName> 으로 적을 것.
; ※ This candidate is saved as 00.reg. In [Registry] of the MHL INI write 00=HKEY_CURRENT_USER\SOFTWARE\<AppName>.
AutoAppName=1

; 저장에 성공한 항목을 MHL INI 의 [Registry] / [RegistryRoot] 형식으로 MIIIMESettingsSaver_Registry.ini 에 저장 (1=사용, 0=미사용).
; MHL INI 에 복사해 쓰는 초안이며 MSS INI 와 같은 폴더에 만들어짐. 내용이 다르면 Overwrite=1 일 때 .bak 로 백업 후 교체. Preview=1 이면 만들지 않음.
; Saves the saved entries as MIIIMESettingsSaver_Registry.ini in the MHL [Registry] / [RegistryRoot] format (1=Enable, 0=Disable).
; A draft to copy into the MHL INI, created in the same folder as the MSS INI. If it differs and Overwrite=1 the old one is backed up as .bak. Not created with Preview=1.
RegIni=1

; ── 내장 안전장치 / Built-in Safety Guard (MHL 과 동일 / same as MHL) ──
;   - HKLM / HKCU 의 SOFTWARE 하위만 허용. HKLM 은 관리자 권한 필요.
;     Only keys under SOFTWARE of HKLM / HKCU. HKLM needs administrator rights.
;   - Run, RunOnce, Policies, Winlogon 등과 공용 영역 (FileExts, OpenWithProgids 등) 은 차단.
;     Run, RunOnce, Policies, Winlogon, etc. and shared areas (FileExts, OpenWithProgids, etc.) are blocked.
;   - 최상위 컨테이너 키 (HKLM\SOFTWARE 등) 자체는 차단.
;     Top-level container keys (HKLM\SOFTWARE, etc.) are blocked.
;   - 위반 항목은 로그에 기록되고 건너뜀. / Violating entries are logged and skipped.
; ※ HKLM\SOFTWARE 키는 MSS 와 같은 비트의 레지스트리 뷰에서 저장됨. (WOW6432Node 는 직접 쓰지 않음)
; ※ HKLM\SOFTWARE keys are saved from the registry view of MSS's own bitness. (Do not write WOW6432Node)

; 형식 : 항목이름=레지스트리 키 전체 경로. 와일드카드는 지원하지 않음. 이 파일의 항목은 AutoAppName(00) 과 연동 모드의 MHL INI 항목 뒤에 더해짐.
; 항목 이름이 겹치면 (파일 이름 충돌) 뒤의 항목을 건너뜀 (WARN). 같은 키 (대소문자만 달라도 같은 키)가 겹치면 먼저 나온 항목만 남김 (INFO).
; Format : EntryName=Full registry key path. Wildcards are not supported. Entries here are added after AutoAppName (00) and the MHL INI entries (linked mode).
; If entry names collide (file name conflict), the later entry is skipped (WARN). If the same key appears twice (differing only in letter case still counts as the same key), only the first one is kept (INFO).
; ※ 공용 영역(Explorer\FileExts / OpenWithProgids / OpenWithList)은 무시됨 (WARN). / Shared areas are ignored (WARN).
; ※ 저장 전에 %TEMP% 에서 .reg 를 검사함: [-키] 삭제 구문이나 차단 구간이 있으면 파일 전체를 저장하지 않음.
; ※ The exported .reg is checked in %TEMP% first: a [-key] delete syntax or a blocked section rejects the whole file.
; ※ 저장본과 내용이 같으면 다시 저장하지 않음. Overwrite=1 이고 다르면 {RawDat}_bakk 로 백업 후 교체.
; ※ Not saved again if the content is identical. If different and Overwrite=1, the old file is backed up to {RawDat}_bakk.
; ※ Preview=1 이면 레지스트리는 읽기만 함 ({RawDat} 에는 아무것도 만들지 않음).
; ※ With Preview=1 the registry is only read (nothing is created in {RawDat}).
; ※ x86 빌드의 MSS 는 HKLM\SOFTWARE 를 32비트 뷰에서, x64 빌드는 64비트 뷰에서 읽음. 64비트 앱은 x64 빌드를 쓸 것 (로그에 안내).
; ※ An x86 build of MSS reads HKLM\SOFTWARE in the 32-bit view, an x64 build in the 64-bit view. Use the x64 build for 64-bit apps (see the log).
01=HKEY_CURRENT_USER\SOFTWARE\VendorName\TargetApp
02=HKEY_LOCAL_MACHINE\SOFTWARE\VendorName\TargetApp
